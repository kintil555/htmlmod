name = "htmlmod-signal"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Origins allowed to open a WebSocket (localhost is always allowed; requests with no Origin header are refused). Comma separated, scheme + host.
[vars]
ALLOWED_ORIGINS = "https://htmlmod.pages.dev"
# "I'm not a robot" check: create a Turnstile widget (dash.cloudflare.com > Turnstile), then run `npx wrangler secret put TURNSTILE_SECRET`
# and put the widget's site key in CONFIG.net.turnstileSiteKey. While the secret is unset the check is off.

# Per-IP limit on /host and /join: 20 connections per 60 s (period can only be 10 or 60). Needs wrangler 4.36+.
[[ratelimits]]
name = "RATE"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Object: the only kind available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
